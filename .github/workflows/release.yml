# Builds Godesk for Windows and Linux when a version tag (v0.1.0, v0.2.0...)
# is pushed, and attaches the installers to a draft GitHub release for that tag.
# Publish the draft once every platform has finished.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix frontend

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Godesk ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system below.

            - **Windows:** `Godesk_*_x64-setup.exe`
            - **Linux:** `.AppImage`, `.deb` or `.rpm`

            macOS is not supported yet.

            The installers are not code-signed yet. On Windows, choose **More info → Run anyway** in SmartScreen.

            Free for personal use and small companies under the PolyForm Small Business License. Larger companies need a commercial license: see COMMERCIAL.md.
          releaseDraft: true
          prerelease: false
