[package]
name = "godesk"
version = "0.1.0"
description = "Infinite canvas of real terminals for running coding agents side by side"
edition = "2024"
rust-version = "1.85"

[lib]
name = "godesk_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
ts-rs = "12"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
png = "0.18"
# Offline speech-to-text: download the whisper.cpp binary and model. native-tls
# uses the OS stack (SChannel on Windows), so no extra build toolchain is needed.
# The connector must be wired into the ureq agent explicitly (see crate::whisper).
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Knowledge-base document extraction to plain text (see crate::extract).
# All pure-Rust, so no extra build toolchain: PDFs, spreadsheets, and the XML
# inside Word/PowerPoint/OpenDocument containers (opened with the `zip` above).
pdf-extract = "0.7"
calamine = "0.37"
quick-xml = "0.37"
# Persistent BM25 full-text index for `godesk kb search`, so a query no longer
# re-reads every document. Pure Rust (Lucene-like), no extra build toolchain.
tantivy = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18"
